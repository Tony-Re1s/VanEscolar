    <path d="M38.5 58 Q41 60.5 43.5 58" stroke="#1D3557" stroke-width="1.4" fill="none" stroke-linecap="round"/>

    <circle cx="66" cy="55" r="7" fill="#C98A5E"/>
    <circle cx="60.5" cy="49.5" r="3" fill="#2B1A10"/><circle cx="71.5" cy="49.5" r="3" fill="#2B1A10"/>
    <path d="M59 53 Q60 46 66 46 Q72 46 73 53 Q69 50 66 50.5 Q63 50 59 53 Z" fill="#2B1A10"/>
    <circle cx="63.5" cy="55" r="1.2" fill="#1D3557"/><circle cx="68.5" cy="55" r="1.2" fill="#1D3557"/>
    <path d="M63.5 58 Q66 60.5 68.5 58" stroke="#1D3557" stroke-width="1.4" fill="none" stroke-linecap="round"/>

    <circle cx="88.5" cy="56" r="6" fill="#F7CBA4"/>
    <path d="M82.5 54 Q83.5 47 88.5 47 Q93.5 47 94.5 54 Q91 51 88.5 51.5 Q86 51 82.5 54 Z" fill="#E0A030"/>
    <circle cx="86.5" cy="56" r="1.1" fill="#1D3557"/><circle cx="90.5" cy="56" r="1.1" fill="#1D3557"/>
    <path d="M86.5 58.6 Q88.5 60.6 90.5 58.6" stroke="#1D3557" stroke-width="1.3" fill="none" stroke-linecap="round"/>
