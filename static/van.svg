  <circle cx="114" cy="70" r="3.5" fill="#FFF6CC" stroke="#1D3557" stroke-width="2"/>
  <rect x="108" y="88" width="14" height="6" rx="3" fill="#9AA5B1" stroke="#1D3557" stroke-width="2.5"/>
  <!-- rodas -->
  <g stroke="#1D3557" stroke-width="3.5">
    <circle cx="44" cy="96" r="11" fill="#2E3A4F"/>
    <circle cx="98" cy="96" r="11" fill="#2E3A4F"/>
  </g>
  <circle cx="44" cy="96" r="4.5" fill="#D9DEE5"/>
  <circle cx="98" cy="96" r="4.5" fill="#D9DEE5"/>
