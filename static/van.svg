  <rect x="38" y="27" width="46" height="7" rx="3.5" fill="#F5A300" stroke="#1D3557" stroke-width="3"/>
  <!-- faixa ESCOLAR -->
  <rect x="24" y="74" width="96" height="8" fill="#1D3557"/>
  <!-- janelas -->
  <g stroke="#1D3557" stroke-width="3">
    <rect x="31" y="42" width="20" height="20" rx="5" fill="#BFE3FF"/>
    <rect x="56" y="42" width="20" height="20" rx="5" fill="#BFE3FF"/>
    <rect x="81" y="42" width="15" height="20" rx="5" fill="#BFE3FF"/>
    <path d="M101 42 H104 Q107 42 109 46 L114 60 Q114.5 62 112 62 H101 Z" fill="#BFE3FF" stroke-linejoin="round"/>
  </g>
  <!-- criancinhas -->
  <g>
    <circle cx="41" cy="55" r="7" fill="#F2B98C"/>
    <path d="M34 53 Q35 45 41 45 Q47 45 48 53 Q44 49 41 50 Q37 49 34 53 Z" fill="#5A3A22"/>
