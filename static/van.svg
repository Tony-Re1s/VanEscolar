<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Pequenos a Bordo">
  <!-- fundo -->
  <rect x="2" y="2" width="124" height="124" rx="30" fill="#E8F4FF"/>
  <!-- linhas de movimento -->
  <g stroke="#9CC9F0" stroke-width="4" stroke-linecap="round">
    <line x1="8" y1="58" x2="18" y2="58"/>
    <line x1="5" y1="70" x2="17" y2="70"/>
    <line x1="9" y1="82" x2="18" y2="82"/>
  </g>
  <!-- sombra -->
  <ellipse cx="68" cy="106" rx="46" ry="5" fill="#1D3557" opacity=".12"/>
  <!-- carroceria -->
  <path d="M24 46 Q24 34 36 34 H92 Q102 34 108 44 L117 62 Q120 67 120 73 V90 Q120 96 114 96 H30 Q24 96 24 90 Z"
