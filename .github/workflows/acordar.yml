name: Manter o app acordado

# O Streamlit Cloud põe o app para "dormir" depois de um tempo sem visitas, e quem abre depois vê a tela
# "Zzzz… This app has gone to sleep" (com a cara do Streamlit). Aqui um navegador abre o app de tempos em tempos —
# e, se ele tiver dormido, clica no botão de acordar — para os motoristas e os pais nunca pegarem essa tela.
on:
  schedule:
    - cron: "17 7,9,11,13,15,17,19,21,23 * * *"   # ~4h a 20h (Brasília), a cada 2 h — cobre as rotas e a noite
    - cron: "17 3 * * *"                           # madrugada
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acordar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q playwright && python -m playwright install --with-deps chromium >/dev/null
      - name: Abrir o app
        run: |
          python - <<'EOF'
          from playwright.sync_api import sync_playwright
          URL = "https://turminhaabordo.streamlit.app/"
          with sync_playwright() as p:
              b = p.chromium.launch()
              pg = b.new_page()
              pg.goto(URL, timeout=90000)
              pg.wait_for_timeout(8000)
              botao = pg.get_by_role("button", name="Yes, get this app back up!")
              if botao.count():
                  print("O app estava dormindo — acordando…")
                  botao.click()
                  pg.wait_for_timeout(60000)
              else:
                  print("O app já estava acordado.")
              pg.wait_for_timeout(5000)
              b.close()
          EOF
